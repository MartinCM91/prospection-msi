<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Prospection MSI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-logo">
      <img src="logo-icam.png" alt="ICAM" onerror="this.style.display='none'">
    </div>
    <h1 class="auth-title">Prospection MSI</h1>
    <p class="auth-subtitle">Outil de pilotage commercial ICAM</p>

    <div class="auth-tabs">
      <button id="tab-login" class="tab-active">Connexion</button>
      <button id="tab-signup">Inscription</button>
    </div>

    <form id="form-login" class="auth-form">
      <label>Email</label>
      <input type="email" id="login-email" required>
      <label>Mot de passe</label>
      <input type="password" id="login-password" required>
      <button type="submit" class="btn-primary">Se connecter</button>
    </form>

    <form id="form-signup" class="auth-form hidden">
      <div class="row">
        <div>
          <label>Prénom</label>
          <input type="text" id="signup-prenom" required>
        </div>
        <div>
          <label>Nom</label>
          <input type="text" id="signup-nom" required>
        </div>
      </div>
      <label>Email</label>
      <input type="email" id="signup-email" required>
      <label>Mot de passe (8 caractères minimum)</label>
      <input type="password" id="signup-password" minlength="8" required>
      <button type="submit" class="btn-primary">Créer mon compte</button>
    </form>

    <div id="auth-message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'app.html';
    });

    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formLogin = document.getElementById('form-login');
    const formSignup = document.getElementById('form-signup');
    const message = document.getElementById('auth-message');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('tab-active');
      tabSignup.classList.remove('tab-active');
      formLogin.classList.remove('hidden');
      formSignup.classList.add('hidden');
      message.innerHTML = '';
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.classList.add('tab-active');
      tabLogin.classList.remove('tab-active');
      formSignup.classList.remove('hidden');
      formLogin.classList.add('hidden');
      message.innerHTML = '';
    });

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.innerHTML = '<p class="info">Connexion en cours...</p>';
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      });
      if (error) {
        message.innerHTML = '<p class="error">' + error.message + '</p>';
      } else {
        window.location.href = 'app.html';
      }
    });

    formSignup.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.innerHTML = '<p class="info">Création du compte...</p>';
      const { error } = await sb.auth.signUp({
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value,
        options: {
          data: {
            prenom: document.getElementById('signup-prenom').value,
            nom: document.getElementById('signup-nom').value
          }
        }
      });
      if (error) {
        message.innerHTML = '<p class="error">' + error.message + '</p>';
      } else {
        message.innerHTML = '<p class="success">Compte créé. Vérifiez votre email pour confirmer, puis connectez-vous.</p>';
      }
    });
  </script>
</body>
</html>
